# ◍ ORBIT — Render Blueprint (free-tier: backend web service)
#
# Render Blueprint spec:
# https://render.com/docs/blueprint-spec
#
# Deployment model:
#   - The production frontend is maintained as a separate Render Static Site.
#   - The Blueprint manages only the backend.
#   - The frontend calls the backend directly.
#
# Backend routes are exposed at ROOT:
#   /health
#   /run
#   /status/{id}
#   /runs
#
# There is NO /api prefix.
#
# Secrets:
#   FREEBUFF_API_KEY uses sync: false.
#   Its value is entered in the Render dashboard and is never stored in Git.
#
# Production frontend:
#   https://orbit-frontend-z1ak.onrender.com
#
# Production backend:
#   https://orbit-backend-qojk.onrender.com
#
# CORS_ORIGINS is the exact public frontend origin and is configured
# explicitly below so Blueprint syncs do not generate a random value.

services:
  # ---------------------------------------------------------------- backend --
  - type: web
    name: orbit-backend
    runtime: python
    rootDir: orbit-backend
    plan: free

    # Pinned dependencies from requirements.txt.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1

    healthCheckPath: /health

    autoDeploy: true

    envVars:
      # ---- secret -----------------------------------------------------------
      # Value is entered in the Render dashboard only.
      - key: FREEBUFF_API_KEY
        sync: false

      # ---- provider / model -------------------------------------------------
      - key: FREEBUFF_BASE_URL
        value: https://openrouter.ai/api/v1

      - key: FREEBUFF_MODEL
        value: openai/gpt-4o-mini

      # ---- CORS -------------------------------------------------------------
      # Exact public production frontend origin.
      # No trailing slash.
      - key: CORS_ORIGINS
        value: https://orbit-frontend-z1ak.onrender.com

      # ---- production-safe limits ------------------------------------------
      - key: MAX_UPLOAD_BYTES
        value: "10485760"

      - key: TASK_TIMEOUT_SECONDS
        value: "120"

      - key: ENABLE_API_DOCS
        value: "0"

      # ---- Python version ---------------------------------------------------
      - key: PYTHON_VERSION
        value: "3.13.6"
